service: opencdr-fleet-manager
frameworkVersion: '4.45.0'
configValidationMode: error

params:
  default:
    securityAccountId: ${env:SECURITY_ACCOUNT_ID, aws:accountId}
    reviewEnforcement: 'true'
    pollingEnabled: 'true'
    securityProfile: standard
    allowedAgentHosts: ''
    snapshotRetentionHours: '24'
    pollConcurrency: 2
    pollIntervalMinutes: '1'
    fullRefreshMinutes: '60'
    detectionPollIntervalMinutes: '1'
    detectionRetentionDays: '90'
    detectionPollingEnabled: 'true'
    detectionPollConcurrency: 2
    detectionEvidenceBucketName: ''

package:
  artifact: build/fleet-manager.zip

provider:
  name: aws
  endpointType: REGIONAL
  runtime: python3.12
  architecture: arm64
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  timeout: 28
  memorySize: 512
  logRetentionInDays: 30
  versionFunctions: false
  iam:
    role:
      mode: perFunction
  stackTags:
    Project: opencdr-fleet-manager
    Stage: ${self:provider.stage}
  tags:
    Project: opencdr-fleet-manager
    Stage: ${self:provider.stage}
  environment:
    LIBRARY_TABLE_NAME: !Ref LibraryTable
    LIBRARY_BUCKET: !Ref LibraryBucket
    FLEET_REVIEW_ENFORCEMENT: ${param:reviewEnforcement}
    CASE_TABLE_NAME: !Ref CaseTable
    CASE_EVIDENCE_BUCKET: !Ref CaseBucket
    SECURITY_ACCOUNT_ID: ${param:securityAccountId}
    FLEET_STAGE: ${self:provider.stage}
    ROLLOUT_TABLE: !Ref RolloutTable
    REGISTRY_TABLE: !Ref RegistryTable
    STATUS_TABLE: !Ref StatusTable
    CACHE_TABLE: !Ref ConfigurationTable
    CREDENTIAL_PREFIX: /opencdr-fleet-manager/${self:provider.stage}/agents
    DETECTION_TABLE: !Ref DetectionTable
    DETECTION_BUCKET: !Ref DetectionBucket
    DETECTION_QUEUE_URL: !Ref DetectionQueue
    DETECTION_POLL_INTERVAL_MINUTES: ${param:detectionPollIntervalMinutes}
    DETECTION_POLLING_ENABLED: ${param:detectionPollingEnabled}
    DETECTION_RETENTION_DAYS: ${param:detectionRetentionDays}
    POLL_QUEUE_URL: !Ref PollQueue
    SNAPSHOT_RETENTION_HOURS: ${param:snapshotRetentionHours}
    POLL_INTERVAL_MINUTES: ${param:pollIntervalMinutes}
    FULL_REFRESH_MINUTES: ${param:fullRefreshMinutes}
    ALLOWED_AGENT_HOSTS: ${param:allowedAgentHosts}

custom:
  registryRead: &registryRead
    Effect: Allow
    Action: [dynamodb:GetItem, dynamodb:Query]
    Resource:
      - !GetAtt RegistryTable.Arn
      - !Sub '${RegistryTable.Arn}/index/agents'
  registryWrite: &registryWrite
    Effect: Allow
    Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
    Resource:
      - !GetAtt RegistryTable.Arn
      - !Sub '${RegistryTable.Arn}/index/agents'
  statusRead: &statusRead
    Effect: Allow
    Action: [dynamodb:GetItem]
    Resource: !GetAtt StatusTable.Arn
  secretsRead: &secretsRead
    Effect: Allow
    Action: ssm:GetParameter
    Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/opencdr-fleet-manager/${self:provider.stage}/agents/*/read-key'
  detectionRead: &detectionRead
    Effect: Allow
    Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:BatchGetItem]
    Resource: [!GetAtt DetectionTable.Arn, !Sub '${DetectionTable.Arn}/index/by-day']
  sendDetection: &sendDetection
    Effect: Allow
    Action: sqs:SendMessage
    Resource: !GetAtt DetectionQueue.Arn
  sendPoll: &sendPoll
    Effect: Allow
    Action: sqs:SendMessage
    Resource: !GetAtt PollQueue.Arn

functions:
  api:
    handler: opencdr_fleet.handlers.api
    iamRoleStatements:
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
        Resource: !GetAtt CaseTable.Arn
        Condition:
          ForAllValues:StringEquals:
            dynamodb:LeadingKeys: ['OWNERSHIP']
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
        Resource: !GetAtt LibraryTable.Arn
        Condition:
          ForAllValues:StringEquals:
            dynamodb:LeadingKeys: ['OWNERSHIP']
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
        Resource: !GetAtt ConfigurationTable.Arn
        Condition:
          ForAllValues:StringEquals:
            dynamodb:LeadingKeys: ['OWNERSHIP']
      - Effect: Allow
        Action: dynamodb:ConditionCheckItem
        Resource: !GetAtt ConfigurationTable.Arn
        Condition:
          ForAllValues:StringLike:
            dynamodb:LeadingKeys: ['FLEET_GROUP#*']
      - Effect: Allow
        Action: dynamodb:PutItem
        Resource: !GetAtt ConfigurationTable.Arn
        Condition:
          ForAllValues:StringLike:
            dynamodb:LeadingKeys: ['FLEET_GROUP#*']
      - Effect: Allow
        Action: dynamodb:ConditionCheckItem
        Resource: !GetAtt RegistryTable.Arn
      - Effect: Allow
        Action: dynamodb:PutItem
        Resource: !GetAtt CaseTable.Arn
        Condition:
          ForAllValues:StringLike:
            dynamodb:LeadingKeys: ['REVIEW#*', 'REVIEW_INDEX#*', 'REVIEW_REQUEST#*', 'REVIEW_AUDIT#*', 'REVIEW_POLICY', 'REVIEW_POLICY_VERSION#*', 'REVIEW_GRANT#*', 'REVIEW_GRANT_REQUEST#*', 'REVIEW_GRANT_AUDIT#*', 'REVIEW_EXECUTION#*', 'ROUTING#*', 'ROUTING_ACTIVATION#*', 'ROUTING_DELIVERY#*', 'ROUTING_OUTCOME#*']
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:ConditionCheckItem]
        Resource: !GetAtt LibraryTable.Arn
      - Effect: Allow
        Action: s3:GetObject
        Resource: !Sub '${LibraryBucket.Arn}/library/*'
      - Effect: Allow
        Action: dynamodb:PutItem
        Resource: !GetAtt LibraryTable.Arn
        Condition:
          ForAllValues:StringLike:
            dynamodb:LeadingKeys: ['ITEM', 'IDENTITY#*', 'VERSION#*', 'AUDIT#*', 'REQUEST#*', 'RELEASE', 'TEST#*', 'COMPILE#*', 'MAPPING#*']
      - Effect: Allow
        Action: s3:PutObject
        Resource: !Sub '${LibraryBucket.Arn}/library/*'
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:ConditionCheckItem]
        Resource: !GetAtt CaseTable.Arn
      - Effect: Allow
        Action: s3:GetObject
        Resource: !Sub '${CaseBucket.Arn}/cases/*'
      - Effect: Allow
        Action: dynamodb:PutItem
        Resource: !GetAtt CaseTable.Arn
        Condition:
          ForAllValues:StringLike:
            dynamodb:LeadingKeys: ['CASE', 'EXTENSION#*', 'AUDIT#*', 'REQUEST#*', 'LINK#*', 'INTEGRATION', 'INTEGRATION_AUDIT#*', 'INTEGRATION_REQUEST#*']
      - Effect: Allow
        Action: dynamodb:DeleteItem
        Resource: !GetAtt CaseTable.Arn
        Condition:
          ForAllValues:StringLike:
            dynamodb:LeadingKeys: ['LINK#*']
      - Effect: Allow
        Action: s3:PutObject
        Resource: !Sub '${CaseBucket.Arn}/cases/*'
      - Effect: Allow
        Action: dynamodb:PutItem
        Resource: !GetAtt CaseTable.Arn
        Condition:
          ForAllValues:StringLike:
            dynamodb:LeadingKeys: ['ACCESS', 'ACCESS_AUDIT#*', 'ACCESS_REQUEST#*', 'IDENTITY_ISSUER', 'IDENTITY_SUBJECT', 'IDENTITY_TRANSPORT', 'IDENTITY_AUDIT#*', 'IDENTITY_REQUEST#*']
      - Effect: Allow
        Action: dynamodb:UpdateItem
        Resource: !GetAtt CaseTable.Arn
        Condition:
          ForAllValues:StringEquals:
            dynamodb:LeadingKeys: ['IDENTITY_AUTHORITY']
      - *registryWrite
      - *statusRead
      - *detectionRead
      - Effect: Allow
        Action: s3:GetObject
        Resource: !Sub '${DetectionBucket.Arn}/detections/*'
      - Effect: Allow
        Action: dynamodb:GetItem
        Resource: !GetAtt RolloutTable.Arn
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:Query]
        Resource: !GetAtt ConfigurationTable.Arn
      - *secretsRead
      - Effect: Allow
        Action: execute-api:Invoke
        Resource:
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/GET/management/observer/*'
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/GET/management/delivery/detections/consumers/subscriber-*'
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/POST/management/delivery/detections/consumers/subscriber-*'
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/POST/management/observer/delegated'
      - Effect: Allow
        Action: ssm:GetParameter
        Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/opencdr-fleet-manager/${self:provider.stage}/agents/*/write-key'
      - *sendPoll
      - Effect: Allow
        Action: dynamodb:PutItem
        Resource: !GetAtt DetectionTable.Arn
        Condition:
          ForAllValues:StringLike:
            dynamodb:LeadingKeys: ['RECONCILIATION#*', 'HANDOFF#*']
      - Effect: Allow
        Action: dynamodb:ConditionCheckItem
        Resource: !GetAtt DetectionTable.Arn
      - Effect: Allow
        Action: sqs:SendMessage
        Resource: !GetAtt DetectionQueue.Arn

      - Effect: Allow
        Action: execute-api:Invoke
        Resource:
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/PUT/management/triage/detections/handling'
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/POST/management/triage/delegated'
    events:
      - http: {path: 'v1/cases', method: get, authorizer: aws_iam}
      - http: {path: 'v1/cases', method: post, authorizer: aws_iam}
      - http: {path: 'v1/case-access', method: get, authorizer: aws_iam}
      - http: {path: 'v1/case-access', method: put, authorizer: aws_iam}
      - http: {path: 'v1/cases/{case_id}', method: get, authorizer: aws_iam}
      - http: {path: 'v1/cases/{case_id}', method: put, authorizer: aws_iam}
      - http: {path: 'v1/cases/{case_id}/notes', method: post, authorizer: aws_iam}
      - http: {path: 'v1/cases/{case_id}/detections', method: post, authorizer: aws_iam}
      - http: {path: 'v1/cases/{case_id}/detections/detach', method: post, authorizer: aws_iam}
      - http: {path: 'v1/cases/{case_id}/history', method: get, authorizer: aws_iam}
      - http: {path: 'v1/cases/{case_id}/evidence', method: get, authorizer: aws_iam}
      - http: {path: v1/detections, method: get, authorizer: aws_iam}
      - http: {path: v1/detections/detail, method: get, authorizer: aws_iam}
      - http: {path: v1/detections/summary, method: get, authorizer: aws_iam}
      - http: {path: v1/cases/active, method: get, authorizer: aws_iam}
      - http: {path: 'v1/case-integrations/{integration_id}', method: get, authorizer: aws_iam}
      - http: {path: 'v1/case-integrations/{integration_id}', method: put, authorizer: aws_iam}
      - http: {path: 'v1/library/{proxy+}', method: any, authorizer: aws_iam}
      - http: {path: v1/status, method: get, authorizer: aws_iam}
      - http: {path: v1/statuses, method: get, authorizer: aws_iam}
      - http: {path: v1/agents, method: get, authorizer: aws_iam}
      - http: {path: v1/agents, method: post, authorizer: aws_iam}
      - http: {path: 'v1/agents/{agent_id}', method: get, authorizer: aws_iam}
      - http: {path: 'v1/agents/{agent_id}', method: put, authorizer: aws_iam}
      - http: {path: 'v1/agents/{agent_id}/refresh', method: post, authorizer: aws_iam}
      - http: {path: 'v1/agents/{agent_id}/detections/outcomes', method: get, authorizer: aws_iam}
      - http: {path: 'v1/agents/{agent_id}/detections/outcomes/history', method: get, authorizer: aws_iam}
      - http: {path: 'v1/agents/{agent_id}/detections/handling', method: get, authorizer: aws_iam}
      - http: {path: 'v1/agents/{agent_id}/detections/handling', method: put, authorizer: aws_iam}
      - http: {path: 'v1/agents/{agent_id}/detections/handling/history', method: get, authorizer: aws_iam}
      - http: {path: 'v1/agents/{agent_id}/detections/status', method: get, authorizer: aws_iam}
      - http: {path: 'v1/agents/{agent_id}/detections/reconcile', method: post, authorizer: aws_iam}
      - http: {path: 'v1/agents/{agent_id}/detections/recover', method: get, authorizer: aws_iam}
      - http: {path: 'v1/agents/{agent_id}/detections/recover', method: post, authorizer: aws_iam}
      - http: {path: 'v1/agents/{agent_id}/detections/handoff', method: get, authorizer: aws_iam}
      - http: {path: 'v1/agents/{agent_id}/detections/handoff', method: post, authorizer: aws_iam}
      - http: {path: 'v1/agents/{agent_id}/configuration', method: get, authorizer: aws_iam}
      - http: {path: 'v1/agents/{agent_id}/api/{proxy+}', method: any, authorizer: aws_iam}
      - http: {path: v1/fleet/read, method: post, authorizer: aws_iam}
      - http: {path: v1/fleet/invoke, method: post, authorizer: aws_iam}
  managementIntegration:
    handler: opencdr_fleet.handlers.api
    environment: {FLEET_MANAGEMENT_ACCESS: integration}
    iamRoleStatements:
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
        Resource: !GetAtt CaseTable.Arn
        Condition:
          ForAllValues:StringEquals:
            dynamodb:LeadingKeys: ['OWNERSHIP']
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:ConditionCheckItem]
        Resource: !GetAtt CaseTable.Arn
      - Effect: Allow
        Action: dynamodb:PutItem
        Resource: !GetAtt CaseTable.Arn
        Condition:
          ForAllValues:StringLike:
            dynamodb:LeadingKeys: ['CASE', 'AUDIT#*', 'REQUEST#*']
    events:
      - http: {path: 'management/integration/{proxy+}', method: any, authorizer: aws_iam}

  managementTriage:
    handler: opencdr_fleet.handlers.api
    environment: {FLEET_MANAGEMENT_ACCESS: triage}
    iamRoleStatements:
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
        Resource: !GetAtt CaseTable.Arn
        Condition:
          ForAllValues:StringEquals:
            dynamodb:LeadingKeys: ['OWNERSHIP']
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
        Resource: !GetAtt LibraryTable.Arn
        Condition:
          ForAllValues:StringEquals:
            dynamodb:LeadingKeys: ['OWNERSHIP']
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
        Resource: !GetAtt ConfigurationTable.Arn
        Condition:
          ForAllValues:StringEquals:
            dynamodb:LeadingKeys: ['OWNERSHIP']
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:ConditionCheckItem]
        Resource: !GetAtt LibraryTable.Arn
      - Effect: Allow
        Action: s3:GetObject
        Resource: !Sub '${LibraryBucket.Arn}/library/*'
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:ConditionCheckItem]
        Resource: !GetAtt CaseTable.Arn
      - Effect: Allow
        Action: s3:GetObject
        Resource: !Sub '${CaseBucket.Arn}/cases/*'
      - Effect: Allow
        Action: dynamodb:PutItem
        Resource: !GetAtt CaseTable.Arn
        Condition:
          ForAllValues:StringLike:
            dynamodb:LeadingKeys: ['CASE', 'EXTENSION#*', 'AUDIT#*', 'REQUEST#*', 'LINK#*']
      - Effect: Allow
        Action: dynamodb:DeleteItem
        Resource: !GetAtt CaseTable.Arn
        Condition:
          ForAllValues:StringLike:
            dynamodb:LeadingKeys: ['LINK#*']
      - Effect: Allow
        Action: s3:PutObject
        Resource: !Sub '${CaseBucket.Arn}/cases/*'
      - *registryRead
      - *statusRead
      - *detectionRead
      - Effect: Allow
        Action: s3:GetObject
        Resource: !Sub '${DetectionBucket.Arn}/detections/*'
      - Effect: Allow
        Action: dynamodb:GetItem
        Resource: !GetAtt RolloutTable.Arn
      - *secretsRead
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:Query]
        Resource: !GetAtt ConfigurationTable.Arn
      - Effect: Allow
        Action: execute-api:Invoke
        Resource:
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/GET/management/observer/*'
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/GET/management/delivery/detections/consumers/subscriber-*'
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/POST/management/delivery/detections/consumers/subscriber-*'
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/POST/management/observer/delegated'
      - Effect: Allow
        Action: execute-api:Invoke
        Resource:
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/PUT/management/triage/detections/handling'
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/POST/management/triage/delegated'
      - Effect: Allow
        Action: sqs:SendMessage
        Resource: !GetAtt DetectionQueue.Arn
    events:
      - http: {path: 'management/triage/{proxy+}', method: any, authorizer: aws_iam}
  managementObserver:
    handler: opencdr_fleet.handlers.api
    environment: {FLEET_MANAGEMENT_ACCESS: observer}
    iamRoleStatements:
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
        Resource: !GetAtt CaseTable.Arn
        Condition:
          ForAllValues:StringEquals:
            dynamodb:LeadingKeys: ['OWNERSHIP']
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
        Resource: !GetAtt LibraryTable.Arn
        Condition:
          ForAllValues:StringEquals:
            dynamodb:LeadingKeys: ['OWNERSHIP']
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
        Resource: !GetAtt ConfigurationTable.Arn
        Condition:
          ForAllValues:StringEquals:
            dynamodb:LeadingKeys: ['OWNERSHIP']
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:ConditionCheckItem]
        Resource: !GetAtt LibraryTable.Arn
      - Effect: Allow
        Action: s3:GetObject
        Resource: !Sub '${LibraryBucket.Arn}/library/*'
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:ConditionCheckItem]
        Resource: !GetAtt CaseTable.Arn
      - Effect: Allow
        Action: s3:GetObject
        Resource: !Sub '${CaseBucket.Arn}/cases/*'
      - *registryRead
      - *statusRead
      - *detectionRead
      - Effect: Allow
        Action: s3:GetObject
        Resource: !Sub '${DetectionBucket.Arn}/detections/*'
      - Effect: Allow
        Action: dynamodb:GetItem
        Resource: !GetAtt RolloutTable.Arn
      - *secretsRead
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:Query]
        Resource: !GetAtt ConfigurationTable.Arn
      - Effect: Allow
        Action: execute-api:Invoke
        Resource:
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/GET/management/observer/*'
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/GET/management/delivery/detections/consumers/subscriber-*'
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/POST/management/delivery/detections/consumers/subscriber-*'
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/POST/management/observer/delegated'
    events:
      - http: {path: 'management/observer/{proxy+}', method: any, authorizer: aws_iam}
  managementOperator:
    handler: opencdr_fleet.handlers.api
    environment:
      FLEET_MANAGEMENT_ACCESS: operator
      ROLLOUT_QUEUE_URL: !Ref RolloutOperatorQueue
    iamRoleStatements:
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
        Resource: !GetAtt CaseTable.Arn
        Condition:
          ForAllValues:StringEquals:
            dynamodb:LeadingKeys: ['OWNERSHIP']
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
        Resource: !GetAtt LibraryTable.Arn
        Condition:
          ForAllValues:StringEquals:
            dynamodb:LeadingKeys: ['OWNERSHIP']
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
        Resource: !GetAtt ConfigurationTable.Arn
        Condition:
          ForAllValues:StringEquals:
            dynamodb:LeadingKeys: ['OWNERSHIP']
      - Effect: Allow
        Action: dynamodb:ConditionCheckItem
        Resource: !GetAtt ConfigurationTable.Arn
        Condition:
          ForAllValues:StringLike:
            dynamodb:LeadingKeys: ['FLEET_GROUP#*']
      - Effect: Allow
        Action: dynamodb:ConditionCheckItem
        Resource: !GetAtt DetectionTable.Arn
        Condition:
          ForAllValues:StringLike:
            dynamodb:LeadingKeys: ['AGENT#*']
      - Effect: Allow
        Action: dynamodb:PutItem
        Resource: !GetAtt ConfigurationTable.Arn
        Condition:
          ForAllValues:StringLike:
            dynamodb:LeadingKeys: ['FLEET_GROUP#*']
      - Effect: Allow
        Action: dynamodb:ConditionCheckItem
        Resource: !GetAtt RegistryTable.Arn
      - Effect: Allow
        Action: dynamodb:PutItem
        Resource: !GetAtt CaseTable.Arn
        Condition:
          ForAllValues:StringLike:
            dynamodb:LeadingKeys: ['REVIEW#*', 'REVIEW_INDEX#*', 'REVIEW_REQUEST#*', 'REVIEW_AUDIT#*', 'REVIEW_EXECUTION#*', 'ROUTING#*', 'ROUTING_ACTIVATION#*', 'ROUTING_DELIVERY#*', 'ROUTING_OUTCOME#*']
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:ConditionCheckItem]
        Resource: !GetAtt LibraryTable.Arn
      - Effect: Allow
        Action: s3:GetObject
        Resource: !Sub '${LibraryBucket.Arn}/library/*'
      - Effect: Allow
        Action: dynamodb:PutItem
        Resource: !GetAtt LibraryTable.Arn
        Condition:
          ForAllValues:StringLike:
            dynamodb:LeadingKeys: ['ITEM', 'IDENTITY#*', 'VERSION#*', 'AUDIT#*', 'REQUEST#*', 'RELEASE', 'TEST#*', 'COMPILE#*', 'MAPPING#*']
      - Effect: Allow
        Action: s3:PutObject
        Resource: !Sub '${LibraryBucket.Arn}/library/*'
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:ConditionCheckItem]
        Resource: !GetAtt CaseTable.Arn
      - Effect: Allow
        Action: s3:GetObject
        Resource: !Sub '${CaseBucket.Arn}/cases/*'
      - Effect: Allow
        Action: dynamodb:PutItem
        Resource: !GetAtt CaseTable.Arn
        Condition:
          ForAllValues:StringLike:
            dynamodb:LeadingKeys: ['CASE', 'EXTENSION#*', 'AUDIT#*', 'REQUEST#*', 'LINK#*']
      - Effect: Allow
        Action: dynamodb:DeleteItem
        Resource: !GetAtt CaseTable.Arn
        Condition:
          ForAllValues:StringLike:
            dynamodb:LeadingKeys: ['LINK#*']
      - Effect: Allow
        Action: s3:PutObject
        Resource: !Sub '${CaseBucket.Arn}/cases/*'
      - *registryRead
      - *statusRead
      - *detectionRead
      - Effect: Allow
        Action: s3:GetObject
        Resource: !Sub '${DetectionBucket.Arn}/detections/*'
      - Effect: Allow
        Action: dynamodb:GetItem
        Resource: !GetAtt RolloutTable.Arn
      - *sendPoll
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:Query]
        Resource: !GetAtt ConfigurationTable.Arn
      - Effect: Allow
        Action: execute-api:Invoke
        Resource:
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/GET/management/observer/*'
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/GET/management/delivery/detections/consumers/subscriber-*'
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/POST/management/delivery/detections/consumers/subscriber-*'
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/POST/management/observer/delegated'
      - Effect: Allow
        Action: execute-api:Invoke
        Resource:
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/*/management/operator/*'
      - Effect: Allow
        Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:BatchWriteItem, dynamodb:ConditionCheckItem]
        Resource: !GetAtt RolloutTable.Arn
        Condition:
          ForAllValues:StringLike:
            dynamodb:LeadingKeys: ['operator-*']
      - Effect: Allow
        Action: sqs:SendMessage
        Resource: !GetAtt RolloutOperatorQueue.Arn
      - Effect: Allow
        Action: execute-api:Invoke
        Resource:
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/PUT/management/triage/detections/handling'
          - !Sub 'arn:${AWS::Partition}:execute-api:*:*:*/*/POST/management/triage/delegated'
      - Effect: Allow
        Action: sqs:SendMessage
        Resource: !GetAtt DetectionQueue.Arn
    events:
      - http: {path: 'management/operator/{proxy+}', method: any, authorizer: aws_iam}
  managementResponder:
