resources:
  extensions:
    DetectionScheduleEventsRuleSchedule1:
      Properties:
        ScheduleExpression:
          Fn::If: [DetectionPollEveryMinute, 'rate(1 minute)', 'rate(${param:detectionPollIntervalMinutes} minutes)']
    ScheduleEventsRuleSchedule1:
      Properties:
        ScheduleExpression:
          Fn::If: [PollEveryMinute, 'rate(1 minute)', 'rate(${param:pollIntervalMinutes} minutes)']
  Conditions:
    HasPinnedDetectionBucket: !Not [!Equals ['${param:detectionEvidenceBucketName}', '']]
    DetectionPollEveryMinute: !Equals ['${param:detectionPollIntervalMinutes}', '1']
    Hardened: !Equals ['${param:securityProfile}', hardened]
    PollEveryMinute: !Equals ['${param:pollIntervalMinutes}', '1']
  Resources:
    LibraryTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:service}-${self:provider.stage}-library
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions: [{AttributeName: pk, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
        KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
        PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
        SSESpecification: {SSEEnabled: true}
    LibraryBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        VersioningConfiguration: {Status: Enabled}
        OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          IgnorePublicAcls: true
          BlockPublicPolicy: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
    LibraryBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref LibraryBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Deny
              Principal: '*'
              Action: 's3:*'
              Resource: [!GetAtt LibraryBucket.Arn, !Sub '${LibraryBucket.Arn}/*']
              Condition: {Bool: {'aws:SecureTransport': false}}
    CaseTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:service}-${self:provider.stage}-cases
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions: [{AttributeName: pk, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
        KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
        PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
        SSESpecification: {SSEEnabled: true}
    CaseBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        VersioningConfiguration: {Status: Enabled}
        OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          IgnorePublicAcls: true
          BlockPublicPolicy: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
    CaseBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref CaseBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Deny
              Principal: '*'
              Action: 's3:*'
              Resource: [!GetAtt CaseBucket.Arn, !Sub '${CaseBucket.Arn}/*']
              Condition: {Bool: {'aws:SecureTransport': false}}
    DetectionTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:service}-${self:provider.stage}-detections
        BillingMode: PAY_PER_REQUEST
        SSESpecification: {SSEEnabled: true}
        PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
        TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
        AttributeDefinitions:
          - {AttributeName: pk, AttributeType: S}
          - {AttributeName: sk, AttributeType: S}
          - {AttributeName: day, AttributeType: S}
          - {AttributeName: order, AttributeType: S}
        KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
        GlobalSecondaryIndexes:
          - IndexName: by-day
            KeySchema: [{AttributeName: day, KeyType: HASH}, {AttributeName: order, KeyType: RANGE}]
            Projection:
              ProjectionType: INCLUDE
              NonKeyAttributes: [agent_id, account_id, region, stage, detection_id, kind, committed_at, revision, summary, expires_at]
    DetectionBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: !If [HasPinnedDetectionBucket, '${param:detectionEvidenceBucketName}', !Ref 'AWS::NoValue']
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        OwnershipControls:
          Rules: [{ObjectOwnership: BucketOwnerEnforced}]
        LifecycleConfiguration:
          Rules:
            - Id: DetectionEvidenceRetention
              Status: Enabled
              Prefix: detections/
              ExpirationInDays: ${param:detectionRetentionDays}
              AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
    DetectionBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref DetectionBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Deny
              Principal: '*'
              Action: 's3:*'
              Resource: [!GetAtt DetectionBucket.Arn, !Sub '${DetectionBucket.Arn}/*']
              Condition: {Bool: {'aws:SecureTransport': 'false'}}
    DetectionQueue:
      Type: AWS::SQS::Queue
      Properties:
        VisibilityTimeout: 360
        MessageRetentionPeriod: 3600
        SqsManagedSseEnabled: true
        RedrivePolicy: {deadLetterTargetArn: !GetAtt DetectionDeadLetterQueue.Arn, maxReceiveCount: 3}
    DetectionDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties: {MessageRetentionPeriod: 1209600, SqsManagedSseEnabled: true}
    DetectionDeadLetterAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: Detection receipt failed. Inspect retained checkpoints before replay.
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions: [{Name: QueueName, Value: !GetAtt DetectionDeadLetterQueue.QueueName}]
        Statistic: Maximum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
    DetectionCollectionFailureAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: A Core feed failed validation or delivery. Inspect per-agent collection status.
        Namespace: OpenCDR/Fleet
        MetricName: DetectionCollectionFailures
        Dimensions: [{Name: Stage, Value: '${self:provider.stage}'}]
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 2
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
    DetectionRetentionGapAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: A detection consumer needs explicit backfill or reconciliation. Do not reset its checkpoint blindly.
        Namespace: OpenCDR/Fleet
        MetricName: DetectionRetentionGaps
        Dimensions: [{Name: Stage, Value: '${self:provider.stage}'}]
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
    DetectionLagAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: Detection queue age exceeds the collection freshness budget.
        Namespace: AWS/SQS
        MetricName: ApproximateAgeOfOldestMessage
        Dimensions: [{Name: QueueName, Value: !GetAtt DetectionQueue.QueueName}]
        Statistic: Maximum
        Period: 60
        EvaluationPeriods: 2
        Threshold: 120
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
    RolloutTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:service}-${self:provider.stage}-rollouts
        BillingMode: PAY_PER_REQUEST
        SSESpecification: {SSEEnabled: true}
        PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
        TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
        AttributeDefinitions: [{AttributeName: pk, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
        KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
    RolloutOperatorQueue:
      Type: AWS::SQS::Queue
      Properties:
        VisibilityTimeout: 360
        MessageRetentionPeriod: 3600
        SqsManagedSseEnabled: true
        RedrivePolicy: {deadLetterTargetArn: !GetAtt RolloutDeadLetterQueue.Arn, maxReceiveCount: 3}
    RolloutResponderQueue:
      Type: AWS::SQS::Queue
      Properties:
        VisibilityTimeout: 360
        MessageRetentionPeriod: 3600
        SqsManagedSseEnabled: true
        RedrivePolicy: {deadLetterTargetArn: !GetAtt RolloutDeadLetterQueue.Arn, maxReceiveCount: 3}
    RolloutAdministratorQueue:
      Type: AWS::SQS::Queue
      Properties:
        VisibilityTimeout: 360
        MessageRetentionPeriod: 3600
        SqsManagedSseEnabled: true
        RedrivePolicy: {deadLetterTargetArn: !GetAtt RolloutDeadLetterQueue.Arn, maxReceiveCount: 3}
    RolloutDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties: {MessageRetentionPeriod: 1209600, SqsManagedSseEnabled: true}
    RegistryTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:service}-${self:provider.stage}-agents
        BillingMode: PAY_PER_REQUEST
        SSESpecification: {SSEEnabled: true}
        PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: !If [Hardened, true, false]}
        AttributeDefinitions:
          - {AttributeName: id, AttributeType: S}
          - {AttributeName: record_type, AttributeType: S}
          - {AttributeName: agent_id, AttributeType: S}
        KeySchema: [{AttributeName: id, KeyType: HASH}]
        GlobalSecondaryIndexes:
          - IndexName: agents
            KeySchema: [{AttributeName: record_type, KeyType: HASH}, {AttributeName: agent_id, KeyType: RANGE}]
            Projection: {ProjectionType: ALL}
    StatusTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:service}-${self:provider.stage}-status
        BillingMode: PAY_PER_REQUEST
        SSESpecification: {SSEEnabled: true}
        PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: !If [Hardened, true, false]}
        AttributeDefinitions: [{AttributeName: agent_id, AttributeType: S}]
        KeySchema: [{AttributeName: agent_id, KeyType: HASH}]
    ConfigurationTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:service}-${self:provider.stage}-configuration
        BillingMode: PAY_PER_REQUEST
        SSESpecification: {SSEEnabled: true}
        PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: !If [Hardened, true, false]}
        TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
        AttributeDefinitions: [{AttributeName: pk, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
        KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
    PollQueue:
      Type: AWS::SQS::Queue
      Properties:
        VisibilityTimeout: 360
        MessageRetentionPeriod: 3600
        SqsManagedSseEnabled: true
        RedrivePolicy: {deadLetterTargetArn: !GetAtt PollDeadLetterQueue.Arn, maxReceiveCount: 3}
    PollDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties: {MessageRetentionPeriod: 1209600, SqsManagedSseEnabled: true}
    PollDeadLetterAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: Poll failures require investigation; do not replay stale write requests.
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions: [{Name: QueueName, Value: !GetAtt PollDeadLetterQueue.QueueName}]
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
    PollLagAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: Polling backlog exceeds freshness budget. Review worker capacity and agent latency.
        Namespace: AWS/SQS
        MetricName: ApproximateAgeOfOldestMessage
        Dimensions: [{Name: QueueName, Value: !GetAtt PollQueue.QueueName}]
        Statistic: Maximum
        Period: 60
        EvaluationPeriods: 2
        Threshold: 120
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
  Outputs:
    LibraryTableName:
      Value: !Ref LibraryTable
    LibraryBucketName:
      Value: !Ref LibraryBucket
    CaseTableName:
      Value: !Ref CaseTable
    CaseEvidenceBucketName:
      Value: !Ref CaseBucket
    FleetManagerApiUrl:
      Value: !Sub 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${self:provider.stage}'
    DetectionPollRoleArn:
      Value: !GetAtt DetectionPollIamRoleLambdaExecution.Arn
    DetectionEvidenceBucket:
      Value: !Ref DetectionBucket
    PollRoleArn:
      Value: !GetAtt PollIamRoleLambdaExecution.Arn
    ApiRoleArn:
      Value: !GetAtt ApiIamRoleLambdaExecution.Arn
    ManagementIntegrationRoleArn:
      Value: !GetAtt ManagementIntegrationIamRoleLambdaExecution.Arn
    ManagementTriageRoleArn:
      Value: !GetAtt ManagementTriageIamRoleLambdaExecution.Arn
    ManagementObserverRoleArn:
      Value: !GetAtt ManagementObserverIamRoleLambdaExecution.Arn
    ManagementOperatorRoleArn:
      Value: !GetAtt ManagementOperatorIamRoleLambdaExecution.Arn
    ManagementResponderRoleArn:
      Value: !GetAtt ManagementResponderIamRoleLambdaExecution.Arn
    ManagementAdministratorRoleArn:
      Value: !GetAtt ManagementAdministratorIamRoleLambdaExecution.Arn
    RolloutOperatorRoleArn:
      Value: !GetAtt RolloutOperatorIamRoleLambdaExecution.Arn
    RolloutResponderRoleArn:
      Value: !GetAtt RolloutResponderIamRoleLambdaExecution.Arn
    RolloutAdministratorRoleArn:
      Value: !GetAtt RolloutAdministratorIamRoleLambdaExecution.Arn
    FleetManagerApiId: {Value: !Ref ApiGatewayRestApi}
    SecurityAccountId: {Value: !Ref AWS::AccountId}
    AgentCredentialPrefix: {Value: '/opencdr-fleet-manager/${self:provider.stage}/agents'}
    RegistryTableName: {Value: !Ref RegistryTable}
    StatusTableName: {Value: !Ref StatusTable}
    ConfigurationTableName: {Value: !Ref ConfigurationTable}
    PollDeadLetterQueueUrl: {Value: !Ref PollDeadLetterQueue}
