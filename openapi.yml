        status_code:
          type: integer
        body:
          type: object
          nullable: true
          additionalProperties: true
        attempted:
          type: boolean
        error_code:
          type: string
        outcome:
          type: string
          enum:
          - not_sent
          - unknown
          - failed
        body_omitted:
          type: boolean
        refresh_queued:
          type: boolean
    IndexedDetection: &id018
