components:
  securitySchemes:
    awsSigV4:
      type: apiKey
      in: header
      name: Authorization
      x-amazon-apigateway-authtype: awsSigv4
  schemas:
    Registration:
      type: object
      additionalProperties: false
      required:
      - agent_id
      - account_id
      - region
      - stage
      - api_url
      properties:
        agent_id:
          type: string
        name:
          type: string
        account_id:
          type: string
          pattern: ^[0-9]{12}$
        region:
          type: string
        stage:
          type: string
        api_url:
          type: string
          format: uri
        enabled:
          type: boolean
          default: true
        allow_writes:
          type: boolean
          default: false
        settings_ids:
          type: array
          items:
            type: string
          default:
          - global
        integration_ids:
          type: array
          items:
            type: string
          default: []
        expected_rev:
          type: integer
          minimum: 1
          description: Required for registration PUT; not agent resource revision.
    ForwardRequest:
      type: object
      additionalProperties: false
      required:
      - agent_ids
      - path
      properties:
        agent_ids:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - DELETE
          default: GET
        path:
          type: string
          description: Core relative path, without query or URL.
        query:
          type: object
          additionalProperties: true
        body:
          type: object
          additionalProperties: true
    ForwardResult:
      type: object
      required:
      - agent_id
      - status_code
      additionalProperties: true
      properties:
        agent_id:
          type: string
        status_code:
          type: integer
        body:
          type: object
          nullable: true
          additionalProperties: true
        attempted:
          type: boolean
        error_code:
          type: string
        outcome:
          type: string
          enum:
          - not_sent
          - unknown
          - failed
        body_omitted:
          type: boolean
        refresh_queued:
          type: boolean
