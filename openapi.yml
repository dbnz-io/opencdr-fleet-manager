openapi: 3.0.3
info:
  title: OpenCDR Fleet Manager
  version: 1.0.0
  description: Organization-local multi-account management. Core owns detections; Fleet owns organization-local
    operational cases and explicit case account grants. Core remains authoritative for agent configuration;
    cached observations are explicitly timestamped. API Gateway uses IAM/SigV4. Management roles separate
    observation, configuration and response. Registration requires administrator access. Durable rollouts
    require the same management access used for the review; unknown outcomes must be inspected before
    a new plan.
security:
- awsSigV4: []
paths:
  /v1/library/{proxy}:
    parameters:
    - name: proxy
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Read the Fleet-owned content library
      description: Owner-wide items, immutable versions, artifacts, audit history and frozen release snapshots.
        Routes are documented in docs/content-library.md. Does not query member Cores. Page limit 1..50;
        next_after is an opaque item ID or numeric version/revision. Saved drafts have validation_state
        not_run. Imports are caller_declared.
      responses:
        '200':
          description: Requested library view with Fleet deployment identity
        '403':
          description: IAM human management access required
        '404':
          description: Item or route not found
        '410':
          description: Retained artifact unavailable
        '502':
          description: Artifact checksum verification failed
    post:
      summary: Create a draft item, version or frozen snapshot
      description: Operator, responder or administrator only. Requires stable request_id and reason; new
        versions also require expected_rev. No activation, validation, approval or Git fetch occurs. Snapshots
        resolve up to 25 pinned items including declared dependencies. Retry an uncertain result with
        the identical body and request ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Confirmed immutable version or snapshot, with idempotent receipt
        '400':
          description: Invalid bounded library request
        '403':
          description: Operator access required
        '409':
          description: Revision, request ID, runtime identity or dependency conflict
        '413':
          description: Document, request or dependency limit exceeded
    put:
      summary: Change item title, description or archive flag
      description: PUT items/{content_id}. Requires expected_rev, request_id, reason, title, description,
        archived. Runtime identity is immutable. Archive preserves versions and snapshots.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: New head revision and append-only audit entry
        '403':
          description: Operator access required
        '409':
          description: Revision or request ID conflict
  /v1/agents/{agent_id}/detections/status:
    get:
      description: Durable collection receipt status, freshness, backlog and explicit gaps. Does not fetch
        the agent or acknowledge its feed.
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Collection status without evidence or opaque checkpoints
        '404':
          description: Unknown agent
        '503':
          description: Detection collection is not installed
  /v1/status:
    get:
      description: Reports health/configuration polling cadence and capabilities. Detection collection
        has its own cadence and reports its installation capability.
      responses:
        '200':
          description: Result or Core proxy envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  poll_interval_seconds:
                    type: integer
                    minimum: 60
                    maximum: 3600
                  full_refresh_interval_seconds:
                    type: integer
                    minimum: 60
                    maximum: 86400
                  stale_after_seconds:
                    type: integer
                    minimum: 180
                  polling_scope:
                    type: array
                    items:
                      type: string
                      enum:
                      - health
                      - configuration
                additionalProperties: true
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403':
          description: IAM or agent write permissions refused
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '409':
          description: Revision conflict or identity mismatch
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '502':
          description: Agent unavailable or invalid response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
