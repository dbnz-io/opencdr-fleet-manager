openapi: 3.0.3
info:
  title: OpenCDR Fleet Manager
  version: 1.0.0
  description: Organization-local multi-account management. Core remains authoritative;
    cached observations are explicitly timestamped. API Gateway uses IAM/SigV4.
security:
- awsSigV4: []
paths:
