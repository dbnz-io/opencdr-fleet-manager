  /v1/rollouts/plan:
    post:
      summary: Freeze up to 100 explicit member approval targets
      description: Review enforcement requires exact approved Core member plans and a separate Fleet approval.
        No unknown target is automatically resent.
      parameters: []
      responses:
        '201':
          description: Durable job state; stored and runtime activation are separate.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403':
          description: Live authority denied.
        '409':
          description: Stale plan, changed registration or approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - targets
              - request_id
              - reason
              properties:
                targets:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - agent_id
                    - approval_id
                    - expected_rev
                    properties:
                      agent_id:
                        type: string
                      approval_id:
                        type: string
                        pattern: ^[a-f0-9]{32}$
                      expected_rev:
                        type: integer
                        minimum: 1
                request_id:
                  type: string
                  pattern: ^[a-f0-9]{32}$
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
  /v1/rollouts/{rollout_id}/apply:
    post:
      summary: Queue an exact Fleet approval with bounded authority
      description: Review enforcement requires exact approved Core member plans and a separate Fleet approval.
        No unknown target is automatically resent.
      parameters:
      - name: rollout_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^(operator|responder|administrator)-[a-f0-9]{32}$
      responses:
        '202':
