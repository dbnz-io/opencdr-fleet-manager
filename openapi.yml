      - &id016
        name: case_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{32}$
      - name: after
        in: query
        schema:
          type: string
          maxLength: 2048
      responses:
        '200':
          description: Case-owner state with exact revision and authenticated attribution. Historical
            imports are unverified and never executable.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403':
          description: Current account or triage authority denied.
        '404':
          description: Case unavailable in the authorized scope.
        '409':
          description: Changed revision, request conflict or immutable history.
    post:
      summary: Retain provider-results without external execution
      description: Current case revision, stable request_id and complete case scope required. No provider
        call, notification, quota claim or paid authorization is created.
      security:
      - AwsSigV4: []
      parameters:
      - *id016
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - expected_rev
              - request_id
              - reason
              - indicator
              - provider
              - reference
              - source_sha256
              - observed_at
              - result
              properties:
                expected_rev:
                  type: integer
                  minimum: 1
                request_id:
                  type: string
                  pattern: ^[a-f0-9]{32}$
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
                indicator: *id017
                provider:
                  type: string
                  pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
                reference:
                  type: string
                  maxLength: 512
                source_sha256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                observed_at:
                  type: string
                  format: date-time
                result:
                  type: object
                  description: Retained historical result, maximum 16 KiB. Never an execution authorization.
      responses:
        '200':
          description: Case-owner state with exact revision and authenticated attribution. Historical
            imports are unverified and never executable.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403':
          description: Current account or triage authority denied.
        '404':
          description: Case unavailable in the authorized scope.
        '409':
          description: Changed revision, request conflict or immutable history.
components:
