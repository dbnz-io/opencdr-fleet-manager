      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - expected_rev
              - request_id
              - reason
              - approval_id
              properties:
                expected_rev:
                  type: integer
                  minimum: 1
                request_id:
                  type: string
                  pattern: ^[a-f0-9]{32}$
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
                approval_id:
                  type: string
                  pattern: ^[a-f0-9]{32}$
