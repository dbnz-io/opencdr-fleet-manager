            configuration writes.
        allow_writes:
          type: boolean
          default: false
        settings_ids:
          type: array
          items:
            type: string
          default:
          - global
        integration_ids:
          type: array
          items:
            type: string
          default: []
        expected_rev:
          type: integer
          minimum: 1
          description: Required for registration PUT; not agent resource revision.
        auth_mode:
          type: string
          enum:
          - iam
          - legacy-api-key
          default: iam
        write_access:
          type: string
          enum:
          - operator
          - responder
          - administrator
          default: operator
    ForwardRequest:
      type: object
      additionalProperties: false
      required:
      - agent_ids
      - path
      properties:
        agent_ids:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - DELETE
          default: GET
        path:
          type: string
          description: Core relative path, without query or URL.
        query:
          type: object
          additionalProperties: true
        body:
          type: object
          additionalProperties: true
    ForwardResult:
      type: object
      required:
      - agent_id
      - status_code
