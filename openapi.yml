                - previous_owner
                - checkpoint
                - expected_generation
                - expected_registration_rev
                - history_complete
                properties:
                  agent_id:
                    type: string
                  consumer_id: &id007
                    type: string
                    pattern: ^[A-Za-z0-9_-]{1,80}$
                  previous_owner:
                    type:
                    - string
                    - 'null'
                  checkpoint:
                    type: object
                    additionalProperties: false
                    required:
                    - cursor
                    - sequence
                    - receipt_id
                    properties:
                      cursor:
                        type: string
                        minLength: 1
                        maxLength: 512
