    parameters:
    - in: path
      name: agent_id
      required: true
      schema:
        type: string
    post:
      summary: Queue reviewed detection gap reconciliation for the original worker
      description: Administrator only. Binds to a gapped local checkpoint and registration revision. The
        original detection worker performs Core reconciliation using its own principal; generic proxy
        calls cannot take over its consumer. Unknown history requires explicit acceptance. A different
        pending request requires supersedes_request_id. Acceptance is not worker completion; inspect agent
        detection status.
      security:
      - awsSigV4: []
      responses:
        '400':
          description: Invalid request
        '403':
          description: Insufficient IAM profile
        '409':
          description: Revision, plan, lease or reconciliation conflict
        '410':
          description: Feed incarnation changed or retained history unavailable
        '202':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                - request_id
                - state
                properties:
                  request_id:
                    type: string
                    pattern: ^[a-f0-9]{32}$
                  state:
                    enum:
                    - accepted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - backfill_job_id
              - plan_digest
              - reason
              - accept_unrecoverable
              - request_id
              - expected_generation
              - expected_registration_rev
              properties:
                backfill_job_id:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{1,80}$
                plan_digest:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                reason:
                  type: string
                  minLength: 1
                  maxLength: 512
                accept_unrecoverable:
                  enum:
                  - true
                request_id:
                  type: string
                  pattern: ^[a-f0-9]{32}$
                expected_generation:
                  type: integer
                  minimum: 1
                expected_registration_rev:
                  type: integer
                  minimum: 1
                supersedes_request_id:
                  type: string
                  pattern: ^[a-f0-9]{32}$
