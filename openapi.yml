    get:
      responses:
        '200':
          description: Result or Core proxy envelope
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403':
          description: IAM or agent write permissions refused
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '409':
          description: Revision conflict or identity mismatch
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '502':
          description: Agent unavailable or invalid response
          content:
            application/json:
              schema:
