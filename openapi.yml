            schema:
              type: object
              additionalProperties: false
              properties:
                after:
                  type: string
                  description: Last target from the previous next_after value.
  /v1/detections:
    get:
      summary: Bounded indexed signal/correlation summaries. No evidence read or live member fanout. Empty
        pages may have continuation; check coverage.
      description: Requires IAM management access. Browsing never advances a feed checkpoint.
      parameters: &id004
      - name: date_from
        in: query
        required: false
        schema:
          type: string
        description: Inclusive UTC Core commit date; default last seven days. Maximum window 90 days.
      - name: date_to
        in: query
        required: false
        schema:
          type: string
        description: Inclusive UTC Core commit date; cannot be after today.
      - name: agent_ids
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated agent identities, at most 100. This filter is not authorization.
      - name: account_ids
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated 12-digit AWS accounts, at most 100.
      - name: severity
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated severities: CRITICAL,HIGH,MEDIUM,LOW,INFO,INFORMATIONAL.'
      - name: kind
        in: query
        required: false
        schema:
          type: string
        description: signal or correlation.
      - name: rule_id
        in: query
        required: false
        schema:
          type: string
        description: Exact rule ID.
      - name: source
        in: query
        required: false
        schema:
          type: string
        description: Exact source.
      - name: integration_id
        in: query
        required: false
        schema:
          type: string
        description: Exact integration ID.
      - name: next_token
        in: query
        required: false
        schema:
          type: string
        description: Opaque position bound to owner and all filters/page size; expires after one hour.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: status
        schema:
          type: string
          enum: &id002
          - open
          - acknowledged
          - resolved
          - dismissed
      - in: query
        name: disposition
        schema:
          type: string
          enum: &id003
          - untriaged
          - true-positive
          - benign-expected
          - false-positive
          - duplicate
          - insufficient-context
      - in: query
        name: has_incident
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - in: query
        name: status
        schema:
          type: string
          enum: *id002
      - in: query
        name: disposition
        schema:
          type: string
          enum: *id003
      - in: query
        name: has_incident
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      responses:
        '200':
          description: Result with explicit coverage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionQueryPage'
        '400':
          description: Invalid, expired or differently scoped query/cursor
        '403':
          description: IAM management access required
        '404':
          description: Unknown or expired detection
        '409':
          description: Historical index backfill required
        '410':
          description: Evidence expired
        '503':
          description: Query capability/storage unavailable
  /v1/detections/summary:
    get:
      summary: Bounded counts; complete=false is a lower bound. Collection and historical coverage remain
        separate.
      description: Requires IAM management access. Browsing never advances a feed checkpoint.
      parameters: *id004
      responses:
        '200':
          description: Result with explicit coverage
