                        pattern: ^[a-f0-9]{32}$
                  expected_generation: &id005
                    type: integer
                    minimum: 1
                  expected_registration_rev: &id006
                    type: integer
                    minimum: 1
                  history_complete:
                    const: false
        '400':
          description: Invalid request
        '403':
          description: IAM authority or target identity required
        '404':
          description: Consumer or handoff not found
        '409':
          description: Plan, revision, target or checkpoint conflict
        '410':
          description: Retired consumer or changed feed incarnation
    post:
      summary: 'Administrator: queue a reviewed consumer handoff'
